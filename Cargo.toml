[package]
name = "can_parser"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egui = "0.28"
eframe = "0.28"

# 💡 MacとLinuxの双方でエラーを起こさない、実務の「条件付き通信パーツ」の正しい書き方です
[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "4.0.0"
